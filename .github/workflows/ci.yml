name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements/core.txt
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements/core.txt pytest sudachipy sudachidict_core
      - name: Run tests
        working-directory: app
        shell: bash
        run: |
          set +e
          python -m pytest -q -rfE tests -p no:cacheprovider 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          # Surface each failure (and its error lines) as an annotation on the run page.
          grep -E "^(FAILED|ERROR) " pytest.log | while read -r line; do echo "::error title=Test failed::$line"; done
          grep -E "^E   " pytest.log | head -40 | while read -r line; do echo "::warning title=Error detail::$line"; done
          exit $status

  windows-launcher:
    name: Yakusuru.exe on real Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Launch the committed exe against a stand-in app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root  = Join-Path $env:RUNNER_TEMP "Yaku"
          $log   = Join-Path $env:RUNNER_TEMP "called.txt"
          New-Item -ItemType Directory -Force "$root\Windows", "$root\app\requirements" | Out-Null
          Copy-Item Windows\Yakusuru.exe "$root\Windows\"
          Copy-Item app\requirements\core.txt "$root\app\requirements\"
          # Stand-in bootstrap.py: records how it was started, then exits 0 like the real one.
          "import sys, pathlib`npathlib.Path(r'$log').write_text('|'.join(sys.argv[1:]), encoding='utf-8')" |
            Set-Content -Encoding utf8 "$root\app\bootstrap.py"
          # A ready environment: real venv (has pythonw.exe) + marker with the requirements hash.
          $venv = Join-Path $env:LOCALAPPDATA "Yakusuru\venv"
          python -m venv $venv
          $h = (Get-FileHash "$root\app\requirements\core.txt" -Algorithm SHA256).Hash.ToLower().Substring(0, 16)
          Set-Content -NoNewline -Encoding ascii "$venv\.core-installed" "$h|ci"
          $p = Start-Process -FilePath "$root\Windows\Yakusuru.exe" -ArgumentList '"C:\Videos\ep 01 会話.mp4"' -PassThru -Wait
          "exit code: $($p.ExitCode)"
          $got = Get-Content -Raw -Encoding utf8 $log
          "bootstrap received: $got"
          if ($got -ne 'C:\Videos\ep 01 会話.mp4') { throw "Launcher didn't forward the file name correctly" }
          if ($p.ExitCode -ne 0) { throw "Launcher exited with $($p.ExitCode)" }
      - name: Check it's a GUI app (no console window flashes)
        shell: python
        run: |
          import struct
          d = open(r"Windows/Yakusuru.exe", "rb").read()
          pe = struct.unpack_from("<I", d, 0x3C)[0]
          sub = struct.unpack_from("<H", d, pe + 24 + 68)[0]
          print("subsystem", sub)
          assert sub == 2, "Yakusuru.exe must use the Windows GUI subsystem"

  build-launcher:
    name: Rebuild Yakusuru.exe from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ziglang
      - run: bash Windows/launcher/build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: Yakusuru-exe
          path: Windows/Yakusuru.exe
